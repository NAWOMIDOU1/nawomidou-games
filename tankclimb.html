<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タンククライマー｜NAWOMIDOUゲーム館</title>
<style>
  body { margin:0; background:#14161f; display:flex; flex-direction:column; align-items:center; font-family:sans-serif; }
  h1 { color:#e8e4da; font-size:20px; margin:10px 0 4px; }
  p { color:#9aa; font-size:13px; margin:2px 0 8px; }
  canvas { background:#1d2130; border:2px solid #39406e; border-radius:8px; max-width:96vw; height:auto; }
</style>
</head>
<body>
<h1>タンククライマー</h1>
<p>移動：←→／AD　ハシゴ：↑↓／WS　ジャンプ：スペース　チェーンソーでタンクを切れ！</p>
<canvas id="game" width="900" height="600"></canvas>
<script>
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 900, H = 600;

// ===== 足場（下が0、上が6。y1=左端の高さ, y2=右端の高さ） =====
const FLOORS = [
  { x1: 40, y1: 556, x2: 860, y2: 540 },
  { x1: 40, y1: 452, x2: 860, y2: 468 },
  { x1: 40, y1: 364, x2: 860, y2: 348 },
  { x1: 40, y1: 260, x2: 860, y2: 276 },
  { x1: 40, y1: 178, x2: 860, y2: 162 },
  { x1: 40, y1: 100, x2: 560, y2: 100 },
  { x1: 390, y1: 52, x2: 560, y2: 52 }
];
function surfY(f, x) { return f.y1 + (f.y2 - f.y1) * (x - f.x1) / (f.x2 - f.x1); }
function downhill(f) { return f.y2 > f.y1 ? 1 : -1; } // yが大きい方＝下り

// ===== ハシゴ（lower段からupper段へ） =====
const LADDERS = [
  { x: 180, lower: 0 }, { x: 700, lower: 0 },
  { x: 300, lower: 1 }, { x: 780, lower: 1 },
  { x: 120, lower: 2 }, { x: 560, lower: 2 },
  { x: 380, lower: 3 }, { x: 820, lower: 3 },
  { x: 200, lower: 4 }, { x: 520, lower: 4 },
  { x: 470, lower: 5 }
];

// ===== 状態（宣言時に初期化する） =====
let mode = 'title'; // title / play / clear / dead / over
let stage = 1, score = 0, lives = 3, frame = 0, modeT = 0;
let high = 0;
try { high = parseInt(localStorage.getItem('tankclimbHigh') || '0', 10) || 0; } catch (e) { high = 0; }

const P = { x: 120, y: 556, floor: 0, dir: 1, mode: 'floor', vy: 0, ladder: null, invuln: 0, walkF: 0, airFrom: -1 };
let tanks = [], monsters = [], parts = [], pops = [], pickups = [];
let sawT = 0;              // チェーンソー残り時間（フレーム）
let tankTimer = 120, monTimer = 400, bossArm = 0;
let gearRot = 0;

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'Enter') advance();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('mousedown', () => advance());

function advance() {
  if (mode === 'title') startGame();
  else if (mode === 'over') { mode = 'title'; }
}

function tankSpeed() { return 1.35 + (stage - 1) * 0.18; }
function tankInterval() { return Math.max(120, 205 - (stage - 1) * 16); }
function monCap() { return Math.min(3 + Math.floor((stage - 1) / 2), 5); }

function resetStage(full) {
  tanks = []; monsters = []; parts = []; pops = [];
  pickups = [
    { x: 620, floor: 1, taken: false },
    { x: 240, floor: 3, taken: false }
  ];
  sawT = 0;
  tankTimer = 150; monTimer = 420; bossArm = 0;
  P.x = 120; P.floor = 0; P.y = surfY(FLOORS[0], P.x);
  P.mode = 'floor'; P.vy = 0; P.ladder = null; P.dir = 1; P.invuln = 150;
  if (full) { score = 0; lives = 3; stage = 1; }
}
function startGame() { resetStage(true); mode = 'play'; modeT = 0; }

function spawnTank() {
  tanks.push({ x: 185, floor: 5, y: surfY(FLOORS[5], 185) - 15, falling: false, fromFloor: -1, vy: 0, vx: 0, rot: 0, counted: false });
}
function spawnMonster() {
  monsters.push({ x: 78, floor: 0, dir: 1, bob: Math.random() * 60, climb: null, counted: false });
}

function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random() * 0.8) * (spd || 2);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: 22 + Math.random() * 14, color });
  }
}
function pop(x, y, text, color) { pops.push({ x, y, text, color: color || '#ffe27a', life: 46 }); }
function addScore(n, x, y, label) { score += n; if (label) pop(x, y, label, '#ffe27a'); if (score > high) { high = score; try { localStorage.setItem('tankclimbHigh', String(high)); } catch (e) {} } }

// ===== 更新 =====
function update() {
  frame++;
  gearRot += 0.004;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; if (--p.life <= 0) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.y -= 0.6; if (--p.life <= 0) pops.splice(i, 1); }
  if (mode === 'clear' || mode === 'dead') { if (++modeT > 130) { if (mode === 'clear') { stage++; resetStage(false); mode = 'play'; } else { if (lives > 0) { resetStage(false); mode = 'play'; } else mode = 'over'; } modeT = 0; } return; }
  if (mode !== 'play') return;
  if (P.invuln > 0) P.invuln--;
  if (sawT > 0) sawT--;

  // --- ボスがタンクを転がす ---
  if (--tankTimer <= 0) { spawnTank(); tankTimer = tankInterval(); bossArm = 26; }
  if (bossArm > 0) bossArm--;
  // --- ガスモンスター出現 ---
  if (--monTimer <= 0) { if (monsters.length < monCap()) spawnMonster(); monTimer = 460 + Math.random() * 160; }

  updatePlayer();
  updateTanks();
  updateMonsters();
  checkHits();
  // --- ゴール：最上段（6）に着地したらクリア ---
  if (P.mode === 'floor' && P.floor === 6) {
    addScore(1500, 475, 30, 'RESCUE! +1500');
    mode = 'clear'; modeT = 0;
  }
}

function updatePlayer() {
  const left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD;
  const up = keys.ArrowUp || keys.KeyW, down = keys.ArrowDown || keys.KeyS;
  const SPD = 2.3, CLIMB = 1.7;

  if (P.mode === 'climb') {
    const lad = P.ladder, fU = FLOORS[lad.lower + 1], fL = FLOORS[lad.lower];
    const topY = surfY(fU, lad.x), botY = surfY(fL, lad.x);
    if (up) P.y -= CLIMB;
    if (down) P.y += CLIMB;
    if (P.y <= topY) { P.y = topY; P.floor = lad.lower + 1; P.mode = 'floor'; P.ladder = null; }
    else if (P.y >= botY) { P.y = botY; P.floor = lad.lower; P.mode = 'floor'; P.ladder = null; }
    return;
  }

  if (P.mode === 'floor') {
    // ハシゴに乗る（チェーンソー使用中は登れない）
    if (sawT <= 0) {
      for (const lad of LADDERS) {
        if (Math.abs(P.x - lad.x) > 14) continue;
        if (lad.lower === P.floor && up) { P.mode = 'climb'; P.ladder = lad; P.x = lad.x; return; }
        if (lad.lower + 1 === P.floor && down) { P.mode = 'climb'; P.ladder = lad; P.x = lad.x; return; }
      }
    }
    if (left) { P.x -= SPD; P.dir = -1; P.walkF++; }
    if (right) { P.x += SPD; P.dir = 1; P.walkF++; }
    const f = FLOORS[P.floor];
    if (P.x < f.x1 - 6 || P.x > f.x2 + 6) { P.mode = 'air'; P.vy = 0; P.airFrom = P.floor; } // 端から落ちる
    else { P.x = Math.max(f.x1 - 6, Math.min(f.x2 + 6, P.x)); P.y = surfY(f, Math.max(f.x1, Math.min(f.x2, P.x))); }
    if (keys.Space) { P.mode = 'air'; P.vy = -5.8; P.airFrom = -1; keys.Space = false; }
  } else { // air
    if (left) { P.x -= SPD; P.dir = -1; }
    if (right) { P.x += SPD; P.dir = 1; }
    P.x = Math.max(16, Math.min(W - 16, P.x));
    const prevBottom = P.y;
    P.vy += 0.28; P.y += P.vy;
    if (P.vy > 0) {
      let best = -1, bestY = 1e9;
      for (let i = 0; i < FLOORS.length; i++) {
        if (i === P.airFrom) continue; // 歩いて落ちた段には着地し直さない
        const f = FLOORS[i];
        if (P.x < f.x1 - 6 || P.x > f.x2 + 6) continue;
        const sy = surfY(f, Math.max(f.x1, Math.min(f.x2, P.x)));
        if (prevBottom <= sy + 1 && P.y >= sy && sy < bestY) { best = i; bestY = sy; }
      }
      if (best >= 0) { P.floor = best; P.y = bestY; P.mode = 'floor'; P.vy = 0; P.airFrom = -1; }
    }
    if (P.y > H + 40) { die(); }
  }

  // チェーンソー拾い
  for (const pk of pickups) {
    if (pk.taken) continue;
    const sy = surfY(FLOORS[pk.floor], pk.x);
    if (Math.abs(P.x - pk.x) < 24 && P.y > sy - 44 && P.y < sy + 8) { pk.taken = true; sawT = 1080; pop(pk.x, sy - 46, 'チェーンソー!', '#9fe8ff'); }
  }
}

function updateTanks() {
  for (let i = tanks.length - 1; i >= 0; i--) {
    const t = tanks[i];
    if (t.falling) {
      const prevB = t.y + 15;
      t.vy += 0.4; t.y += t.vy; t.x += t.vx; t.rot += 0.12;
      t.x = Math.max(40, Math.min(860, t.x)); // 端から落ちても下の段の範囲内に収め、着地できるようにする
      let landed = false;
      for (let fi = 0; fi < FLOORS.length; fi++) {
        if (fi === t.fromFloor) continue; // 落ちた段には着地し直さない
        const f = FLOORS[fi];
        if (t.x < f.x1 || t.x > f.x2) continue;
        const sy = surfY(f, t.x);
        if (prevB <= sy + 1 && t.y + 15 >= sy) { t.floor = fi; t.y = sy - 15; t.falling = false; landed = true; break; }
      }
      if (!landed && t.y > H + 30) tanks.splice(i, 1);
      continue;
    }
    const f = FLOORS[t.floor];
    const d = t.floor === 5 ? 1 : downhill(f); // 最上段は平らなので右へ転がす
    t.x += d * tankSpeed();
    t.rot += d * 0.09;
    if (t.x < f.x1 - 4 || t.x > f.x2 + 4) {
      if (t.floor === 0) { tanks.splice(i, 1); continue; } // 最下段の端＝回収ドロップ
      t.falling = true; t.fromFloor = t.floor; t.vy = 0; t.vx = d * tankSpeed() * 0.55;
      t.x = Math.max(f.x1 - 4, Math.min(f.x2 + 4, t.x));
    } else {
      t.y = surfY(f, t.x) - 15;
    }
  }
}

function updateMonsters() {
  for (const m of monsters) {
    m.bob += 0.08;
    if (m.climb) {
      const target = surfY(FLOORS[m.climb.to], m.x);
      m.y += Math.sign(target - m.y) * 1.1;
      if (Math.abs(m.y - target) < 2) { m.floor = m.climb.to; m.y = target; m.climb = null; }
      continue;
    }
    const f = FLOORS[m.floor];
    m.y = surfY(f, m.x);
    m.x += m.dir * 0.65;
    if (m.x < f.x1 + 16) { m.x = f.x1 + 16; m.dir = 1; }
    if (m.x > f.x2 - 16) { m.x = f.x2 - 16; m.dir = -1; }
    // ハシゴを見つけたら、たまに上り下りする
    for (const lad of LADDERS) {
      if (Math.abs(m.x - lad.x) < 3 && Math.random() < 0.006) {
        if (lad.lower === m.floor && m.floor < 5) { m.climb = { to: m.floor + 1 }; m.x = lad.x; }
        else if (lad.lower + 1 === m.floor) { m.climb = { to: m.floor - 1 }; m.x = lad.x; }
      }
    }
  }
}

function checkHits() {
  if (mode !== 'play') return;
  const pTop = P.y - 34, pBot = P.y;
  // タンク
  for (let i = tanks.length - 1; i >= 0; i--) {
    const t = tanks[i], tTop = t.y - 15, tBot = t.y + 15;
    // 飛び越し得点
    if (P.mode === 'air' && !t.counted && Math.abs(P.x - t.x) < 20 && pBot < tTop + 6) { t.counted = true; addScore(100, t.x, tTop - 12, '+100'); }
    if (Math.abs(P.x - t.x) < (sawT > 0 ? 42 : 18) && pBot > tTop + 22 && pTop < tBot - 4) {
      if (sawT > 0) { burst(t.x, t.y, '#cfd6dd', 14, 2.6); addScore(300, t.x, tTop - 14, 'CUT! +300'); tanks.splice(i, 1); }
      else if (P.invuln <= 0) { die(); return; }
    }
  }
  // ガスモンスター
  for (let i = monsters.length - 1; i >= 0; i--) {
    const m = monsters[i], my = (m.y !== undefined ? m.y : surfY(FLOORS[m.floor], m.x));
    const mTop = my - 26, mBot = my;
    if (P.mode === 'air' && !m.counted && Math.abs(P.x - m.x) < 20 && pBot < mTop + 6) { m.counted = true; addScore(100, m.x, mTop - 12, '+100'); }
    if (Math.abs(P.x - m.x) < (sawT > 0 ? 40 : 19) && pBot > mTop + 14 && pTop < mBot - 2) {
      if (sawT > 0) { burst(m.x, my - 12, '#8fe388', 14, 2.4); addScore(200, m.x, mTop - 14, 'CUT! +200'); monsters.splice(i, 1); }
      else if (P.invuln <= 0) { die(); return; }
    }
  }
}

function die() {
  if (mode !== 'play') return;
  lives--;
  burst(P.x, P.y - 16, '#ff9a7a', 16, 2.6);
  mode = 'dead'; modeT = 0;
}

// ===== 描画 =====
function draw() {
  ctx.clearRect(0, 0, W, H);
  // 背景：工場の壁と歯車
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#232838'); g.addColorStop(1, '#171a26');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#8fa3c8';
  for (const [gx, gy, gr] of [[120, 120, 54], [790, 90, 40], [700, 330, 62], [90, 350, 36]]) {
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(gearRot * (gr % 2 ? 1 : -1));
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-6, -gr, 12, 16); }
    ctx.beginPath(); ctx.arc(0, 0, gr - 8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  drawGirders();
  drawLadders();
  drawPickups();
  drawBoss();
  drawWakaha();
  drawGasDrum();
  for (const t of tanks) drawTank(t);
  for (const m of monsters) drawMonster(m);
  drawPlayer();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / 30); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.life / 30); ctx.fillStyle = p.color; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
  drawHUD();
  if (mode === 'title') overlay('タンククライマー', '転がるステンレスタンクをかわし、ハシゴを登ってワカハを助けよう。\nタンクは素手では壊せない。チェーンソーを拾えば切断できる！（18秒間・その間ハシゴは登れない）\nクリックかスペースでスタート');
  else if (mode === 'over') overlay('GAME OVER', 'SCORE ' + score + '\nクリックかスペースでタイトルへ');
  else if (mode === 'clear') overlay('STAGE CLEAR!', 'ワカハを助けた！ +1500');
  else if (mode === 'dead') overlay('クラッシュ！', lives > 0 ? '残り ' + lives + ' 人' : '……');
}

function drawGirders() {
  for (const f of FLOORS) {
    ctx.strokeStyle = '#c96a2e'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(f.x1, f.y1 + 4); ctx.lineTo(f.x2, f.y2 + 4); ctx.stroke();
    ctx.strokeStyle = '#e8934a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(f.x1, f.y1 + 1); ctx.lineTo(f.x2, f.y2 + 1); ctx.stroke();
    ctx.fillStyle = '#7a3f16';
    const n = Math.floor((f.x2 - f.x1) / 46);
    for (let i = 0; i <= n; i++) { const x = f.x1 + i * 46; ctx.beginPath(); ctx.arc(x, surfY(f, x) + 4, 2.4, 0, Math.PI * 2); ctx.fill(); }
  }
}
function drawLadders() {
  ctx.strokeStyle = '#aebfd4'; ctx.lineWidth = 3;
  for (const lad of LADDERS) {
    const topY = surfY(FLOORS[lad.lower + 1], lad.x), botY = surfY(FLOORS[lad.lower], lad.x);
    ctx.beginPath(); ctx.moveTo(lad.x - 8, botY); ctx.lineTo(lad.x - 8, topY); ctx.moveTo(lad.x + 8, botY); ctx.lineTo(lad.x + 8, topY); ctx.stroke();
    ctx.lineWidth = 2;
    for (let y = botY - 10; y > topY + 2; y -= 12) { ctx.beginPath(); ctx.moveTo(lad.x - 8, y); ctx.lineTo(lad.x + 8, y); ctx.stroke(); }
    ctx.lineWidth = 3;
  }
}
function drawPickups() {
  for (const pk of pickups) {
    if (pk.taken) continue;
    const sy = surfY(FLOORS[pk.floor], pk.x);
    const bobY = Math.sin(frame * 0.06 + pk.x) * 2;
    ctx.save(); ctx.translate(pk.x, sy - 12 + bobY);
    ctx.fillStyle = '#d8433a'; ctx.fillRect(-13, -5, 16, 10); // 本体
    ctx.fillStyle = '#cfd6dd'; ctx.fillRect(3, -3, 20, 5);    // バー
    ctx.fillStyle = '#5a6068'; for (let i = 0; i < 5; i++) ctx.fillRect(5 + i * 4, 2, 2, 3);
    ctx.fillStyle = '#333'; ctx.fillRect(-16, -8, 5, 6);      // ハンドル
    ctx.restore();
  }
}
function drawBoss() {
  const bx = 105, by = surfY(FLOORS[5], bx); // 足場5の上
  ctx.save(); ctx.translate(bx, by);
  // 脚と胴体（暴走工事ロボット）
  ctx.fillStyle = '#4a5058'; ctx.fillRect(-26, -34, 14, 34); ctx.fillRect(12, -34, 14, 34);
  ctx.fillStyle = '#39424e'; ctx.fillRect(-34, -86, 68, 54);
  ctx.fillStyle = '#59636f'; ctx.fillRect(-34, -86, 68, 10);
  // 目（赤いバイザー）
  ctx.fillStyle = '#ff4545'; ctx.fillRect(-22, -74, 44, 9);
  ctx.fillStyle = '#ffd2d2'; ctx.fillRect(-4 + Math.sin(frame * 0.11) * 12, -72, 8, 5);
  // アンテナ
  ctx.strokeStyle = '#8b95a1'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -86); ctx.lineTo(0, -100); ctx.stroke();
  ctx.fillStyle = (frame % 60 < 30) ? '#ff4545' : '#7a2020'; ctx.beginPath(); ctx.arc(0, -103, 4, 0, Math.PI * 2); ctx.fill();
  // 腕（タンクを転がす側＝右腕。予告で上がる）
  const armUp = (tankTimer < 34 || bossArm > 0) ? -18 : 0;
  ctx.fillStyle = '#4a5058'; ctx.fillRect(30, -78 + armUp, 26, 11);
  // そばのタンク置き場
  ctx.restore();
  drawTankShape(196, by - 15, 0.4);
  drawTankShape(196, by - 45, 0.9);
}
function drawWakaha() {
  const wx = 512, wy = surfY(FLOORS[6], wx);
  ctx.save(); ctx.translate(wx, wy);
  const wave = Math.sin(frame * 0.09) * 2;
  // ワカハ（助けを待つ）
  ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(0, -34, 9, 0, Math.PI * 2); ctx.fill(); // 顔
  ctx.fillStyle = '#e8b64c'; ctx.fillRect(-10, -40, 4, 26); ctx.fillRect(6, -40, 4, 26);      // ロングヘア
  ctx.fillStyle = '#ff7aa8'; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(-9, 0); ctx.lineTo(9, 0); ctx.closePath(); ctx.fill(); // ドレス
  ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6, -22); ctx.lineTo(-14, -30 + wave); ctx.stroke(); // 手を振る
  ctx.restore();
  if (frame % 300 < 170) {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(wx - 36, wy + 34, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('助けて！', wx - 36, wy + 37);
  }
}
function drawGasDrum() {
  const dx = 64, dy = surfY(FLOORS[0], dx);
  ctx.save(); ctx.translate(dx, dy);
  ctx.fillStyle = '#3f9e4d'; ctx.fillRect(-13, -40, 26, 40);
  ctx.fillStyle = '#2f7a3a'; ctx.fillRect(-13, -40, 26, 6); ctx.fillRect(-13, -8, 26, 5);
  ctx.fillStyle = '#dff5df'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GAS', 0, -18);
  ctx.restore();
}
function drawTankShape(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(0);
  // ステンレスタンク（横向きの円柱）
  const grd = ctx.createLinearGradient(0, -15, 0, 15);
  grd.addColorStop(0, '#eef2f5'); grd.addColorStop(0.45, '#aeb9c2'); grd.addColorStop(0.55, '#8b98a3'); grd.addColorStop(1, '#d7dee4');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#6d7984'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.rotate(rot);
  ctx.strokeStyle = 'rgba(90,102,112,0.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-5, -6, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawTank(t) { drawTankShape(t.x, t.y, t.rot); }
function drawMonster(m) {
  const my = (m.y !== undefined ? m.y : surfY(FLOORS[m.floor], m.x));
  const bobY = Math.sin(m.bob) * 2.4;
  ctx.save(); ctx.translate(m.x, my - 13 + bobY);
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = '#69c24f';
  ctx.beginPath();
  ctx.arc(0, -4, 12, Math.PI, 0);
  ctx.lineTo(12, 8);
  for (let i = 0; i < 4; i++) { ctx.lineTo(9 - i * 6, 4 + ((i % 2) ? 3 : 0)); }
  ctx.lineTo(-12, 8); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4.5, -6, 3.4, 0, Math.PI * 2); ctx.arc(4.5, -6, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1d2b16'; ctx.beginPath(); ctx.arc(-4.5 + m.dir, -6, 1.7, 0, Math.PI * 2); ctx.arc(4.5 + m.dir, -6, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1d2b16'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, 0, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}
function drawPlayer() {
  if (mode === 'title' || mode === 'over') return;
  if (P.invuln > 0 && mode === 'play' && (frame % 8 < 4)) return; // 無敵点滅
  ctx.save(); ctx.translate(P.x, P.y);
  const run = (P.mode === 'floor' && (keys.ArrowLeft || keys.ArrowRight || keys.KeyA || keys.KeyD)) ? Math.sin(P.walkF * 0.55) * 4 : 0;
  const climbPose = P.mode === 'climb';
  // 脚
  ctx.strokeStyle = '#2c4a7c'; ctx.lineWidth = 5;
  ctx.beginPath();
  if (climbPose) { ctx.moveTo(0, -14); ctx.lineTo(-5, -6 + Math.sin(frame * 0.3) * 3); ctx.moveTo(0, -14); ctx.lineTo(5, -6 - Math.sin(frame * 0.3) * 3); }
  else { ctx.moveTo(0, -14); ctx.lineTo(-4 + run, 0); ctx.moveTo(0, -14); ctx.lineTo(4 - run, 0); }
  ctx.stroke();
  // 体（作業着）
  ctx.fillStyle = '#3f74d6'; ctx.fillRect(-8, -28, 16, 15);
  // 顔とヘルメット
  ctx.fillStyle = '#f2c79b'; ctx.beginPath(); ctx.arc(0, -33, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f7b731'; ctx.beginPath(); ctx.arc(0, -35, 7.4, Math.PI, 0); ctx.fill(); ctx.fillRect(-9, -36, 18, 3);
  ctx.restore();
  // チェーンソー（使用中は前に構える）
  if (sawT > 0 && mode === 'play') {
    ctx.save(); ctx.translate(P.x + P.dir * 20, P.y - 16 + Math.sin(frame * 1.7) * 0.8);
    ctx.scale(P.dir, 1);
    ctx.fillStyle = '#d8433a'; ctx.fillRect(-12, -5, 15, 10);
    ctx.fillStyle = '#e8edf1'; ctx.fillRect(3, -3, 24, 5);
    ctx.fillStyle = '#7c8791'; for (let i = 0; i < 6; i++) ctx.fillRect(5 + i * 4, 2, 2, 3);
    ctx.restore();
    if (frame % 5 === 0) parts.push({ x: P.x + P.dir * 34, y: P.y - 18, vx: P.dir * 1.4, vy: -0.6, life: 8, color: '#ffe27a' });
  }
}
function drawHUD() {
  ctx.fillStyle = '#e8e4da'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 16, 24);
  ctx.textAlign = 'center'; ctx.fillText('HI ' + high, W / 2, 24);
  ctx.textAlign = 'right'; ctx.fillText('STAGE ' + stage, W - 16, 24);
  // 残り人数
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#f7b731'; ctx.beginPath(); ctx.arc(24 + i * 22, 44, 6, 0, Math.PI * 2); ctx.fill();
  }
  // チェーンソーゲージ
  if (sawT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(W / 2 - 90, 32, 180, 13);
    ctx.fillStyle = sawT < 240 ? '#ff6b5e' : '#57c7e8';
    ctx.fillRect(W / 2 - 88, 34, 176 * (sawT / 1080), 9);
    ctx.fillStyle = '#e8e4da'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('チェーンソー', W / 2, 58);
  }
}
function overlay(title, sub) {
  ctx.fillStyle = 'rgba(10,12,20,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, H / 2 - 30);
  ctx.fillStyle = '#e8e4da'; ctx.font = '16px sans-serif';
  const lines = sub.split('\n');
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H / 2 + 12 + i * 24));
}

// ===== テスト用フック =====
window.__TC = {
  state: () => ({ mode, stage, score, lives, sawT, tanks: tanks.length, monsters: monsters.length, tankFloors: tanks.map(t => t.floor), monX: monsters.map(m => Math.round(m.x)), pFloor: P.floor, pMode: P.mode, pX: Math.round(P.x), pY: Math.round(P.y) }),
  start: () => { startGame(); },
  key: (code, on) => { keys[code] = !!on; },
  setPlayer: (x, floor) => { P.x = x; P.floor = floor; P.y = surfY(FLOORS[floor], x); P.mode = 'floor'; P.vy = 0; P.ladder = null; },
  setInvuln: n => { P.invuln = n; },
  placeTank: (x, floor) => { tanks.push({ x, floor, y: surfY(FLOORS[floor], x) - 15, falling: false, fromFloor: -1, vy: 0, vx: 0, rot: 0, counted: false }); },
  spawnTank: () => spawnTank(),
  spawnMonster: () => spawnMonster(),
  giveSaw: () => { sawT = 1080; },
  killSaw: () => { sawT = 0; },
  update: () => update(),
  draw: () => draw()
};

// ===== メインループ =====
function loop() { update(); draw(); requestAnimationFrame(loop); }
draw();
loop();
</script>
</body>
