try { unlocked = localStorage.getItem('seisenRpgUnlocked') === '1'; } catch (e) { unlocked = false; }
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function tryUnlock(pw) {
  if (!pw) return false;
  const h = await sha256Hex(String(pw).trim());
  if (h === UNLOCK_HASH) {
    unlocked = true;
    try { localStorage.setItem('seisenRpgUnlocked', '1'); } catch (e) {}
    return true;
  }
  return false;
}

let mode = 'title'; // title / play / dialog / shop / ending / over

let shop = null;     // {kind, cursor}

  shrooms: 0, shroomDone: false, treasures: {}, prisonerGift: false
};
function atkTotal() { return SWORD_ATK[P.tier] + (P.lv - 1); }

// ===== セーブ =====
const SAVE_KEY = 'seisenRpgSave';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      areaId, x: Math.round(P.x), y: Math.round(P.y), hp: P.hp, maxHp: P.maxHp,
      lv: P.lv, exp: P.exp, gold: P.gold, tier: P.tier, potions: P.potions,
      bossDown: P.bossDown, cleared: P.cleared, playTime,
      shrooms: P.shrooms, shroomDone: P.shroomDone,
      treasures: P.treasures, prisonerGift: P.prisonerGift
    }));
    hasSave = true;
  } catch (e) {}
}
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return s; } catch (e) { return null; }
}
hasSave = !!loadSave();

// ===== 入力 =====
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('mousedown', () => { pressed.Mouse = true; });
function actPressed() { return pressed.KeyZ || pressed.Space || pressed.Enter || pressed.Mouse; }
function cancelPressed() { return pressed.KeyX || pressed.Escape; }

// ===== ゲーム開始・エリア移動 =====
function newGame() {
  P.x = 450; P.y = 380; P.hp = 24; P.maxHp = 24; P.lv = 1; P.exp = 0;
  P.gold = 40; P.tier = 0; P.potions = 1; P.bossDown = false; P.cleared = false;
  P.shrooms = 0; P.shroomDone = false; P.treasures = {}; P.prisonerGift = false;
  P.swingT = 0; P.swingCd = 0; P.invuln = 0;
  playTime = 0;
  enterArea('village', P.x, P.y);
  mode = 'play';
  startDialog('村長', [
    'シィカ、よく来てくれた。',
    '聖女エルミリア様が、黒騎士団にさらわれてしまったのじゃ。',
    '城は東の先じゃ。武器屋と道具屋、宿屋を用意しておる。',
    'そして…デイツ殿の「陰」に入ってみよ。あの力が、お前の剣を覚醒させる。'
  ], null);
  saveGame();
}
function continueGame() {
  const s = loadSave();
  if (!s) { newGame(); return; }
  areaId = s.areaId; P.hp = s.hp; P.maxHp = s.maxHp; P.lv = s.lv; P.exp = s.exp;
  P.gold = s.gold; P.tier = s.tier; P.potions = s.potions;
  P.bossDown = s.bossDown; P.cleared = s.cleared; playTime = s.playTime || 0;
  P.shrooms = s.shrooms || 0; P.shroomDone = !!s.shroomDone;
  P.treasures = s.treasures || {}; P.prisonerGift = !!s.prisonerGift;
  P.swingT = 0; P.swingCd = 0; P.invuln = 0;
  enterArea(s.areaId, s.x, s.y);
  mode = 'play';
}
function enterArea(id, x, y) {
  areaId = id;
  const def = AREAS[id];
  P.x = x; P.y = y;
  if (collide(P.x, P.y, 13)) { P.x = 450; P.y = id === 'village' ? 380 : 300; } // 障害物にめり込んでいたら安全な場所へ
  pickupsRt = (def.pickups || []).filter(pk => pk.kind === 'shroom' ? !P.shroomDone : pk.kind === 'chest' ? !P.treasures[pk.id] : true).map(pk => ({ kind: pk.kind, id: pk.id, gold: pk.gold, x: pk.x, y: pk.y, taken: false }));
  enemies = def.spawns.map(s => {
    const t = ENEMY_TYPES[s.type];
    return { type: s.type, x: s.x, y: s.y, hp: t.hp, maxHp: t.hp, r: t.r, dir: Math.random() * 6.28, wanderT: 60 + Math.random() * 80, flash: 0, kbx: 0, kby: 0, shootT: 100 + Math.random() * 80, seed: Math.floor(Math.random() * 280), hopT: Math.random() * 50, hopDx: 0, hopDy: 0, dashT: 0, dashDx: 0, dashDy: 0, lungeCd: 0 };
  });
  shadesRt = def.shades.map(s => ({ x: s.x, y: s.y, special: s.special, withDeitz: s.withDeitz, cd: 0 }));
  bullets = []; waves = [];
  boss = null;
  if (id === 'throne' && !P.bossDown) {
    boss = { x: 450, y: 170, hp: 80, maxHp: 80, state: 'chase', t: 0, shootT: 150, flash: 0, ang: Math.PI / 2, kbx: 0, kby: 0 };
  }
  areaBannerT = 130;
  heartT = 0; heartShade = null;
  if (awake) { /* 覚醒はエリア移動で解除 */ awake = false; gauge = 0; }
}

// ===== 会話・店 =====
function startDialog(name, lines, onDone) { dialog = { name, lines, idx: 0, onDone: onDone || null }; mode = 'dialog'; }
function endDialog() { const f = dialog && dialog.onDone; dialog = null; mode = 'play'; if (f) f(); }
function npcDialog(npc) {
  switch (npc.id) {
    case 'elder':
      startDialog('村長', P.bossDown
        ? ['エルミリア様が戻られた！ 村の皆が喜んでおるぞ。']
        : ['城はずっと東じゃ。森、湖、岩場、洞窟、雪原を抜けて進むのじゃ。', 'デイツ殿の陰で覚醒すれば、強い敵にも勝てるじゃろう。'], null);
      break;
    case 'villager':
      if (P.shroomDone) startDialog('村人', ['この前はありがとう！ おかげで元気になったよ。'], null);
      else if (P.shrooms >= 3) startDialog('村人', ['光るキノコを3つ集めてくれたんだね！', 'お礼に200Gとポーション2個をあげる。ありがとう！'], () => { P.gold += 200; P.potions += 2; P.shroomDone = true; saveGame(); toast('お礼を受け取った！'); });
      else startDialog('村人', ['森に「光るキノコ」が3つあるらしいんだ。集めてきてくれたらお礼をするよ。（今 ' + P.shrooms + '/3）', 'ポーションはXボタン。敵を倒すと経験値とゴールドが手に入るよ。'], null);
      break;
    case 'weapon': openShop('weapon'); break;
    case 'item': openShop('item'); break;
    case 'inn': openShop('inn'); break;
    case 'prisoner':
      if (P.prisonerGift) startDialog('捕らわれた旅人', ['ありがとう、おかげで逃げ出せそうだ。', '王座の間の金色の陰、あれが勝負の決め手だよ。'], null);
      else startDialog('捕らわれた旅人', ['助けてくれてありがとう！ お礼にポーションを2個あげる。', '王座の間には金色の陰がある。あそこで覚醒すれば、団長の弾も斬れるはずだ。'], () => { P.potions += 2; P.prisonerGift = true; saveGame(); toast('ポーション×2 をもらった！'); });
      break;
  }
}

  startDialog('デイツ', ['……俺の立つ陰に入れ。', '3秒、心を合わせれば覚醒できる。覚醒中は剣の力が3倍になる。', '金色の陰は特別だ。剣が長く伸び、ボスの弾も薙ぎ払える。'], null);

function shopItems(kind) {

    if (P.tier >= 2) return [{ label: '聖剣（最強）装備中', price: 0, can: false, note: 'これ以上の剣はありません' }];
    const t = P.tier + 1;
    return [{ label: SWORD_NAME[t] + '（攻撃' + SWORD_ATK[t] + '）', price: SWORD_PRICE[t], can: P.gold >= SWORD_PRICE[t], buy: () => { P.gold -= SWORD_PRICE[t]; P.tier = t; } }];
  }
  if (kind === 'item') return [{ label: 'ポーション（HP16回復）所持:' + P.potions, price: 30, can: P.gold >= 30, buy: () => { P.gold -= 30; P.potions++; } }];
  return [{ label: '泊まる（HP全回復）', price: 10, can: P.gold >= 10, buy: () => { P.gold -= 10; P.hp = P.maxHp; } }];
}
function openShop(kind) { shop = { kind, cursor: 0, msg: '' }; mode = 'shop'; }
function closeShop() { shop = null; mode = 'play'; saveGame(); }
function updateShop() {
  const items = shopItems(shop.kind);
  if (pressed.ArrowDown || pressed.KeyS) shop.cursor = Math.min(items.length - 1, shop.cursor + 1);
  if (pressed.ArrowUp || pressed.KeyW) shop.cursor = Math.max(0, shop.cursor - 1);
  if (actPressed()) {
    const it = items[shop.cursor];
    if (it && it.can && it.buy) { it.buy(); shop.msg = 'ありがとうございました！'; saveGame(); }
    else shop.msg = it && it.note ? it.note : 'ゴールドが足りません';
  }
  if (cancelPressed()) closeShop();
}

// ===== 衝突（障害物） =====
function collide(x, y, r) {
  for (const o of AREAS[areaId].obstacles) {
    if (o.r) { const d = Math.hypot(x - o.x, y - o.y); if (d < r + o.r) return true; }
    else if (x + r > o.x && x - r < o.x + o.w && y + r > o.y && y - r < o.y + o.h) return true;
  }
  return false;
}
function tryMove(o, dx, dy, r) {
  if (!collide(o.x + dx, o.y, r)) o.x += dx;
  if (!collide(o.x, o.y + dy, r)) o.y += dy;
  o.x = Math.max(20, Math.min(W - 20, o.x));
  o.y = Math.max(56, Math.min(H - 20, o.y));
}

// ===== パーティクル等 =====
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 0.6 + Math.random() * 1.8; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + Math.random() * 12, color }); }
}
function gainExp(n) {
  P.exp += n;
  while (P.exp >= expNeed(P.lv)) {
    P.exp -= expNeed(P.lv); P.lv++;
    P.maxHp = maxHpFor(P.lv);
    P.hp = Math.min(P.maxHp, P.hp + 10);
    burst(P.x, P.y, '#ffe27a', 22);
  }
}

// ===== 更新 =====
function update() {
  frame++;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; if (--p.life <= 0) parts.splice(i, 1); }
  if (areaBannerT > 0) areaBannerT--;
  if (gateMsgCd > 0) gateMsgCd--;

  if (mode === 'title') {
    const n = hasSave ? 2 : 1;
    if (pressed.ArrowDown || pressed.KeyS) titleCursor = (titleCursor + 1) % n;
    if (pressed.ArrowUp || pressed.KeyW) titleCursor = (titleCursor + n - 1) % n;
    if (actPressed()) { if (titleCursor === 0) newGame(); else continueGame(); }
    clearPressed(); return;
  }
  if (mode === 'dialog') {
    if (actPressed()) { dialog.idx++; if (dialog.idx >= dialog.lines.length) endDialog(); }
    clearPressed(); return;
  }
  if (mode === 'shop') { updateShop(); clearPressed(); return; }
  if (mode === 'ending') {
    if (actPressed()) { mode = 'title'; hasSave = !!loadSave(); }
    clearPressed(); return;
  }
  if (mode === 'over') {
    if (actPressed()) { P.hp = P.maxHp; P.invuln = 90; enterArea('village', 445, 548); mode = 'play'; saveGame(); }
    clearPressed(); return;
  }
  if (mode !== 'play') { clearPressed(); return; }

  playTime++;
  modeT++;
  if (toastT > 0) toastT--;
  if (modeT % 900 === 0) saveGame();
  if (P.invuln > 0) P.invuln--;
  if (P.swingCd > 0) P.swingCd--;
  if (P.swingT > 0) P.swingT--;
  for (const s of shadesRt) if (s.cd > 0) s.cd--;

  updateHeart();
  if (heartT <= 0) { updatePlayer(); updateEnemies(); updateBoss(); updateBullets(); updateWaves(); }
  clearPressed();
}
function clearPressed() { for (const k in pressed) delete pressed[k]; }

function updateHeart() {
  // 覚醒ゲージ
  if (awake) {
    const inShade = shadesRt.some(s => Math.hypot(P.x - s.x, P.y - s.y) < 78);
    if (!inShade) gauge -= awakeSpecial ? 0.03 : 100 / 840;
    if (gauge <= 0) { awake = false; gauge = 0; if (heartShade) heartShade.cd = 300; }
  }
  if (heartT > 0) {
    heartT--;
    if (heartT === 0) {
      awake = true; awakeSpecial = heartShade.special; gauge = 100;
      burst(P.x, P.y, heartShade.special ? '#ffd94d' : '#ff9ec4', 26);
    }
    return;
  }
  // 陰に入ったらハートタイム開始
  if (!awake) {
    for (const s of shadesRt) {
      if (s.cd <= 0 && Math.hypot(P.x - s.x, P.y - s.y) < 62) { heartT = 180; heartShade = s; break; }
    }
  }
}

function updatePlayer() {
  const def = AREAS[areaId];
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  const spd = awake ? 2.5 : 2.2;
  if (dx || dy) {
    const m = Math.hypot(dx, dy);
    P.ang = Math.atan2(dy, dx);
    tryMove(P, dx / m * spd, dy / m * spd, 13);
  }
  // エリア移動（端）
  const ex = def.exits;
  if (P.x <= 24 && ex.left) moveArea(ex.left);
  else if (P.x >= W - 24 && ex.right) {
    if (ex.right.gate && !unlocked) {
      P.x = W - 26;
      if (gateMsgCd <= 0) { gateMsgCd = 300; startDialog('封印の門', ['この先（岩場・洞窟・城）は有料エリアです。', '合言葉をお持ちの方は、画面下のパネルで解放してください。'], null); }
    } else moveArea(ex.right);
  }
  else if (P.y <= 60 && ex.up) moveArea(ex.up);
  else if (P.y >= H - 24 && ex.down) moveArea(ex.down);

  // 話す／剣
  if (pressed.KeyZ || pressed.Space || pressed.Enter) {
    let talked = false;
    for (const npc of def.npcs) if (Math.hypot(P.x - npc.x, P.y - npc.y) < 44) { npcDialog(npc); talked = true; break; }
    if (!talked) for (const s of shadesRt) if (s.withDeitz && Math.hypot(P.x - (s.x + 34), P.y - s.y) < 44) { deitzDialog(); talked = true; break; }
    if (!talked && areaId === 'throne' && P.bossDown && Math.hypot(P.x - 700, P.y - 150) < 52) {
      startDialog('エルミリア', ['シィカ！ 来てくれたのね。', 'ありがとう。村へ帰りましょう。'], () => { P.cleared = true; saveGame(); mode = 'ending'; });
      talked = true;
    }
    if (!talked) swingSword();
  }
  // ポーション
  if ((pressed.KeyX) && P.potions > 0 && P.hp < P.maxHp) {
    P.potions--; P.hp = Math.min(P.maxHp, P.hp + 16); burst(P.x, P.y, '#8fe388', 10);
  }
  // アイテム拾い
  for (const pk of pickupsRt) {
    if (pk.taken) continue;
    if (Math.hypot(P.x - pk.x, P.y - pk.y) < 26) {
      pk.taken = true;
      if (pk.kind === 'shroom' && P.shrooms < 3) { P.shrooms++; burst(pk.x, pk.y, '#b8ff9e', 12); toast('光るキノコを手に入れた！（' + P.shrooms + '/3）'); saveGame(); }
      if (pk.kind === 'chest') { P.treasures[pk.id] = true; P.gold += pk.gold || 100; burst(pk.x, pk.y, '#ffd94d', 14); toast('宝箱を開けた！ ' + (pk.gold || 100) + 'G 手に入れた'); saveGame(); }
    }
  }
}
function moveArea(exit) { enterArea(exit.to, exit.x, exit.y); saveGame(); }

function swingSword() {
  if (P.swingCd > 0) return;
  P.swingT = 9; P.swingCd = 17;
  const reach = awakeSpecial && awake ? 200 : awake ? 74 : 46;
  const dmg = atkTotal() * (awake ? 3 : 1);
  const hit = (o, r) => {
    const d = Math.hypot(o.x - P.x, o.y - P.y);
    if (d > reach + r) return false;
    let da = Math.atan2(o.y - P.y, o.x - P.x) - P.ang;
    while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
    return Math.abs(da) < 1.2 || d < 24;
  };
  for (const e of enemies) if (hit(e, e.r || 13)) damageEnemy(e, dmg);
  if (boss && hit(boss, 26)) damageBoss(dmg);
  // 覚醒中は衝撃波＋ボスの弾を薙ぎ払う
  if (awake) {
    waves.push({ x: P.x + Math.cos(P.ang) * 30, y: P.y + Math.sin(P.ang) * 30, vx: Math.cos(P.ang) * 3.4, vy: Math.sin(P.ang) * 3.4, life: 16, dmg });
    for (let i = bullets.length - 1; i >= 0; i--) if (hit(bullets[i], 6)) bullets.splice(i, 1);
  }
}
function damageEnemy(e, dmg) {
  if (e.type === 'skeleton' && ((frame + (e.seed || 0)) % 280) < 70) { dmg = Math.max(1, Math.ceil(dmg / 2)); burst(e.x, e.y, '#cfd6dd', 3); } // スケルトンの防御中は半減
  e.hp -= dmg; e.flash = 6;
  e.kbx = Math.cos(Math.atan2(e.y - P.y, e.x - P.x)) * 3; e.kby = Math.sin(Math.atan2(e.y - P.y, e.x - P.x)) * 3;
  if (e.hp <= 0) {
    burst(e.x, e.y, '#cfe8b8', 14);
    gainExp(ENEMY_TYPES[e.type].exp);
    P.gold += ENEMY_TYPES[e.type].gold;
    if (awake) gauge = Math.min(100, gauge + 6);
    enemies.splice(enemies.indexOf(e), 1);
  }
}
function damageBoss(dmg) {
  if (!boss) return;
  boss.hp -= dmg; boss.flash = 6;
  boss.kbx = Math.cos(Math.atan2(boss.y - P.y, boss.x - P.x)) * 1.6; boss.kby = Math.sin(Math.atan2(boss.y - P.y, boss.x - P.x)) * 1.6;
  if (boss.hp <= 0) {
    burst(boss.x, boss.y, '#ffb3a0', 40);
    boss = null; P.bossDown = true; P.gold += 300;
    startDialog('黒騎士団長', ['ぐっ…見事だ、シィカ。', 'エルミリアは連れて行くがよい…。'], () => {
      startDialog('エルミリア', ['シィカ！ ここよ、ここにいるわ！', '（右上のエルミリアに近づいて、Zで話しかけよう）'], null);
    });
    saveGame();
  }
}
function hurtPlayer(dmg) {
  if (P.invuln > 0 || heartT > 0 || mode !== 'play') return;
  P.hp -= dmg; P.invuln = 42;
  burst(P.x, P.y, '#ff8a7a', 8);
  if (P.hp <= 0) { P.hp = 0; mode = 'over'; }
}

function updateEnemies() {
  for (const e of enemies) {
    if (e.flash > 0) e.flash--;
    const er = e.r || 13;
    if (e.kbx || e.kby) { tryMove(e, e.kbx, e.kby, er); e.kbx *= 0.6; e.kby *= 0.6; if (Math.abs(e.kbx) < 0.2) e.kbx = 0; if (Math.abs(e.kby) < 0.2) e.kby = 0; }
    const t = ENEMY_TYPES[e.type];
    const d = Math.hypot(P.x - e.x, P.y - e.y);
    if (e.type === 'mage') {
      // 魔法使い：距離を保って弾を撃つ
      if (d < 300 && heartT <= 0) {
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        if (d < 130) tryMove(e, -Math.cos(a) * t.spd, -Math.sin(a) * t.spd, er);
        if (--e.shootT <= 0) { e.shootT = 175; bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.1, vy: Math.sin(a) * 2.1, dmg: 5 }); }
      }
    } else if (e.type === 'frog') {
      // カエル：止まっては跳ぶ
      if (--e.hopT <= 0) {
        e.hopT = 55 + Math.random() * 30;
        const a = (d < 190 && heartT <= 0) ? Math.atan2(P.y - e.y, P.x - e.x) : Math.random() * 6.28;
        e.hopDx = Math.cos(a) * t.spd; e.hopDy = Math.sin(a) * t.spd;
      }
      if (e.hopT > 38) tryMove(e, e.hopDx, e.hopDy, er);
    } else if (e.type === 'wolf') {
      // オオカミ：近づくと突進
      if (e.lungeCd > 0) e.lungeCd--;
      if (e.dashT > 0) { e.dashT--; tryMove(e, e.dashDx, e.dashDy, er); }
      else if (d < 160 && heartT <= 0) {
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        if (d < 118 && e.lungeCd <= 0) { e.dashDx = Math.cos(a) * 3.4; e.dashDy = Math.sin(a) * 3.4; e.dashT = 13; e.lungeCd = 160; }
        else tryMove(e, Math.cos(a) * t.spd * 1.25, Math.sin(a) * t.spd * 1.25, er);
      } else {
        if (--e.wanderT <= 0) { e.dir = Math.random() * 6.28; e.wanderT = 70 + Math.random() * 90; }
        tryMove(e, Math.cos(e.dir) * t.spd * 0.5, Math.sin(e.dir) * t.spd * 0.5, er);
      }
    } else if (d < 150 && heartT <= 0) {
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      tryMove(e, Math.cos(a) * t.spd * 1.25, Math.sin(a) * t.spd * 1.25, er);
    } else {
      if (--e.wanderT <= 0) { e.dir = Math.random() * 6.28; e.wanderT = e.type === 'bat' ? 24 + Math.random() * 30 : 70 + Math.random() * 90; }
      tryMove(e, Math.cos(e.dir) * t.spd * (e.type === 'bat' ? 0.8 : 0.5), Math.sin(e.dir) * t.spd * (e.type === 'bat' ? 0.8 : 0.5), er);
    }
    if (d < er + 12 && heartT <= 0) hurtPlayer(t.dmg);
  }
}
function updateBoss() {
  if (!boss) return;
  const b = boss;
  if (b.flash > 0) b.flash--;
  if (b.kbx || b.kby) { tryMove(b, b.kbx, b.kby, 24); b.kbx *= 0.6; b.kby *= 0.6; if (Math.abs(b.kbx) < 0.2) b.kbx = 0; if (Math.abs(b.kby) < 0.2) b.kby = 0; }
  const d = Math.hypot(P.x - b.x, P.y - b.y);
  b.ang = Math.atan2(P.y - b.y, P.x - b.x);
  b.t++;
  if (b.state === 'chase') {
    if (d > 96) tryMove(b, Math.cos(b.ang) * 0.95, Math.sin(b.ang) * 0.95, 24);
    else if (b.t > 50) { b.state = 'windup'; b.t = 0; }
    if (--b.shootT <= 0) {
      b.shootT = 175;
      for (let k = -1; k <= 1; k++) bullets.push({ x: b.x, y: b.y, vx: Math.cos(b.ang + k * 0.3) * 2.3, vy: Math.sin(b.ang + k * 0.3) * 2.3, dmg: 6 });
    }
  } else if (b.state === 'windup') {
    if (b.t > 28) { b.state = 'swing'; b.t = 0; if (d < 108) hurtPlayer(9); }
  } else if (b.state === 'swing') {
    if (b.t > 24) { b.state = 'chase'; b.t = 0; b.shootT = Math.min(b.shootT, 90); }
  }
  if (d < 34) hurtPlayer(8);
}
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.x += bl.vx; bl.y += bl.vy;
    if (bl.x < 8 || bl.x > W - 8 || bl.y < 52 || bl.y > H - 8) { bullets.splice(i, 1); continue; }
    if (Math.hypot(P.x - bl.x, P.y - bl.y) < 16) { bullets.splice(i, 1); hurtPlayer(bl.dmg || 6); }
  }
}
function updateWaves() {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.x += w.vx; w.y += w.vy;
    if (--w.life <= 0) { waves.splice(i, 1); continue; }
    for (const e of enemies) if (Math.hypot(e.x - w.x, e.y - w.y) < 24) { damageEnemy(e, w.dmg); w.life = 0; break; }
    if (w.life > 0 && boss && Math.hypot(boss.x - w.x, boss.y - w.y) < 40) { damageBoss(w.dmg); w.life = 0; }
  }
}

// ===== 描画 =====
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.85);
  ctx.bezierCurveTo(x - s * 1.25, y - s * 0.1, x - s * 0.72, y - s * 1.15, x, y - s * 0.32);
  ctx.bezierCurveTo(x + s * 0.72, y - s * 1.15, x + s * 1.25, y - s * 0.1, x, y + s * 0.85);
  ctx.closePath();
}

function drawShade(s) {

  items.forEach((it, i) => {
    const y = 244 + i * 38;
    if (shop.cursor === i) { ctx.fillStyle = 'rgba(201,162,39,.3)'; ctx.fillRect(W / 2 - 210, y - 20, 420, 30); }
    ctx.fillStyle = it.can || !it.buy ? '#fff' : '#8a8f9a'; ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText((shop.cursor === i ? '▶ ' : '　') + it.label, W / 2 - 200, y);
    if (it.price) { ctx.textAlign = 'right'; ctx.fillText(it.price + ' G', W / 2 + 200, y); }
  });
  ctx.fillStyle = '#ffd94d'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(shop.msg || '', W / 2, 330);
  ctx.fillStyle = '#9aa'; ctx.font = '13px sans-serif';
  ctx.fillText('Z：買う　X：店を出る', W / 2, 366);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  for (const s of shadesRt) drawShade(s);
  for (const pk of pickupsRt) {
    if (pk.taken) continue;
    if (pk.kind === 'chest') {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(pk.x + 1, pk.y + 10, 14, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#8a5a2a'; ctx.fillRect(pk.x - 13, pk.y - 6, 26, 15);
      ctx.fillStyle = '#a8722f'; ctx.fillRect(pk.x - 13, pk.y - 11, 26, 7);
      ctx.fillStyle = '#ffd94d'; ctx.fillRect(pk.x - 2.5, pk.y - 11, 5, 20); ctx.fillRect(pk.x - 4, pk.y - 3, 8, 7);
      if (frame % 50 < 25) { ctx.fillStyle = '#fff7ae'; ctx.fillRect(pk.x + 9, pk.y - 16, 2.6, 2.6); }
      continue;
    }
    const glow = 0.6 + Math.sin(frame * 0.08 + pk.x) * 0.3;
    ctx.fillStyle = 'rgba(184,255,158,' + (glow * 0.35) + ')';
    ctx.beginPath(); ctx.arc(pk.x, pk.y, 15, 0, 7); ctx.fill();
    ctx.fillStyle = '#efe8d8'; ctx.fillRect(pk.x - 2.5, pk.y, 5, 8);
    ctx.fillStyle = '#b8ff9e'; ctx.beginPath(); ctx.arc(pk.x, pk.y - 1, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#eaffea'; ctx.beginPath(); ctx.arc(pk.x - 2, pk.y - 3, 1.8, 0, 7); ctx.arc(pk.x + 3, pk.y, 1.5, 0, 7); ctx.fill();
  }
  for (const npc of AREAS[areaId].npcs) drawNpc(npc);
  if (areaId === 'throne') {
    drawElmiria(700, 150, !P.bossDown);
    if (P.bossDown && mode === 'play') {
      const by = 150 - 44 + Math.sin(frame * 0.12) * 4;
      ctx.fillStyle = '#ffd94d'; ctx.beginPath(); ctx.arc(700, by, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#221'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('！', 700, by + 5);
    }
  }
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss(boss);
  for (const bl of bullets) { ctx.fillStyle = '#c9a7ff'; ctx.beginPath(); ctx.arc(bl.x, bl.y, 5, 0, 7); ctx.fill(); }
  for (const w of waves) { ctx.strokeStyle = 'rgba(255,215,120,.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(w.x, w.y, 13, 0, 7); ctx.stroke(); }
  if (mode !== 'title') drawShiika(P.x, P.y, awake, P.ang, P.swingT, P.invuln, awake && awakeSpecial);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / 26); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  // ハートタイム演出
  if (heartT > 0 && heartShade) {
    const t = 1 - heartT / 180;
    ctx.fillStyle = heartShade.special ? 'rgba(255,217,77,.9)' : 'rgba(255,120,170,.9)';
    heartPath(P.x, P.y - 44 - Math.sin(frame * 0.1) * 3, 16 + t * 12); ctx.fill();
    heartPath(heartShade.x + 34, heartShade.y - 40, 10 + t * 8); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const hx = P.x + Math.cos(frame * 0.05 + i * 1.7) * (30 + t * 26);
      const hy = P.y - 10 + Math.sin(frame * 0.07 + i * 2.1) * 18 - t * 16;
      heartPath(hx, hy, 5); ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ハートタイム…', P.x, P.y - 78);
  }
  drawHUD();
  if (toastT > 0 && toastText) {
    ctx.globalAlpha = Math.min(1, toastT / 40);
    ctx.fillStyle = 'rgba(8,10,18,.85)';
    const tw = toastText.length * 15 + 28;
    ctx.fillRect(W / 2 - tw / 2, 128, tw, 30);
    ctx.fillStyle = '#b8ff9e'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(toastText, W / 2, 149);
    ctx.globalAlpha = 1;
  }
  if (mode === 'dialog' && dialog) drawDialog();
  if (mode === 'shop' && shop) drawShop();
  if (mode === 'title') {
    ctx.fillStyle = 'rgba(8,10,18,.82)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('シィカとエルミリアの聖戦RPG', W / 2, 190);
    ctx.fillStyle = '#e8e4da'; ctx.font = '16px sans-serif';
    ctx.fillText('NAWOMIDOUゲーム館 PV100記念', W / 2, 226);
    ctx.fillText('さらわれた聖女エルミリアを救う、小さなアクションRPG', W / 2, 254);
    const items = hasSave ? ['はじめから', 'つづきから'] : ['はじめから'];
    items.forEach((it, i) => {
      ctx.fillStyle = titleCursor === i ? '#ffd94d' : '#e8e4da';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText((titleCursor === i ? '▶ ' : '') + it, W / 2, 330 + i * 40);
    });
    ctx.fillStyle = '#9aa'; ctx.font = '14px sans-serif';
    ctx.fillText('移動：←↑↓→／WASD　話す・剣：Z　ポーション：X', W / 2, 452);
    ctx.fillText(unlocked ? '岩場・洞窟・城エリア：解放済み' : '岩場・洞窟・城エリアは合言葉で解放（画面下のパネル）', W / 2, 480);
  }
  if (mode === 'ending') {
    ctx.fillStyle = 'rgba(8,10,18,.85)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 38px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('エルミリアを救出した！', W / 2, 240);
    ctx.fillStyle = '#e8e4da'; ctx.font = '18px sans-serif';
    ctx.fillText('到達レベル：Lv ' + P.lv, W / 2, 300);
    const mm = Math.floor(playTime / 3600), ss = Math.floor((playTime % 3600) / 60);
    ctx.fillText('プレイ時間：' + mm + '分' + ss + '秒', W / 2, 334);
    ctx.fillText('遊んでくれてありがとうございました。', W / 2, 380);
    ctx.fillStyle = '#9aa'; ctx.font = '14px sans-serif';
    ctx.fillText('Z：タイトルへ', W / 2, 430);
  }
  if (mode === 'over') {
    ctx.fillStyle = 'rgba(8,10,18,.8)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff9a8a'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('シィカは倒れた…', W / 2, 270);
    ctx.fillStyle = '#e8e4da'; ctx.font = '16px sans-serif';
    ctx.fillText('村の宿屋で目覚めました（Z：村へ戻る）', W / 2, 320);
  }
}

// ===== 合言葉パネル =====
(function () {
  const btn = document.getElementById('btnUnlock');
  const input = document.getElementById('unlockInput');
  const msg = document.getElementById('unlockMsg');
  if (!btn || !input || !msg) return;
  if (unlocked) { msg.textContent = '解放済みです'; msg.style.color = '#a5d6a7'; }
  btn.addEventListener('click', async () => {
    const v = input.value.trim();
    if (!v) { msg.textContent = '合言葉を入力してください'; msg.style.color = '#ff8a80'; return; }
    if (await tryUnlock(v)) { msg.textContent = '解放しました！ 岩場へ進めます'; msg.style.color = '#a5d6a7'; }
    else { msg.textContent = '合言葉が違います'; msg.style.color = '#ff8a80'; }
  });
})();

// ===== テスト用フック =====
window.__SR = {
  state: () => ({ mode, areaId, hp: P.hp, maxHp: P.maxHp, lv: P.lv, exp: P.exp, gold: P.gold, tier: P.tier, potions: P.potions, enemies: enemies.length, e0: enemies.length ? { x: Math.round(enemies[0].x), y: Math.round(enemies[0].y) } : null, boss: boss ? boss.hp : null, bPos: boss ? { x: Math.round(boss.x), y: Math.round(boss.y) } : null, bossDown: P.bossDown, cleared: P.cleared, awake, gauge: Math.round(gauge), heartT, unlocked, pX: Math.round(P.x), pY: Math.round(P.y), dialog: dialog ? dialog.name : null, shop: shop ? shop.kind : null, shrooms: P.shrooms, shroomDone: P.shroomDone, chests: Object.keys(P.treasures).length, prisonerGift: P.prisonerGift }),
  newGame: () => newGame(),
  continueGame: () => continueGame(),
  key: (code, on) => { keys[code] = !!on; },
  press: code => { pressed[code] = true; },
  setPlayer: (x, y) => { P.x = x; P.y = y; },
  goto: (area, x, y) => enterArea(area, x, y),
  giveGold: n => { P.gold += n; },
  setHp: n => { P.hp = n; },
  hurt: n => { P.invuln = 0; hurtPlayer(n); },
  tryUnlock: pw => tryUnlock(pw),
  saveNow: () => saveGame(),
  update: () => update(),
  draw: () => draw()
};

// ===== メインループ =====
function loop() { update(); draw(); requestAnimationFrame(loop); }
draw();
loop();
</script>
</body>
