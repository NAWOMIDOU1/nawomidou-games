<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スカイシールド｜NAWOMIDOUゲーム館</title>
<style>
  body{font-family:sans-serif;background:#0a0f1a;color:#e8f6ff;margin:0;padding:16px;text-align:center}
  h1{font-size:24px;margin:8px 0}
  p{color:#a9bed6;font-size:14px;line-height:1.6}
  #wrap{max-width:480px;margin:0 auto}
  canvas{width:100%;height:auto;background:#0b1026;border:2px solid #35507a;border-radius:10px;touch-action:none;cursor:crosshair}
  .hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;max-width:480px;margin:8px auto;font-weight:bold;font-size:15px}
  #status{color:#ffd94d;min-height:1.4em;font-size:14px}
  .btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
  button{font-size:17px;padding:11px 16px;border-radius:999px;border:none;background:#27ae60;color:#fff;cursor:pointer}
  button:active{background:#2ecc71}
  .big{color:#ffd94d;font-weight:bold}
</style>
</head>
<body>
<div id="wrap">
  <h1>🛡️ スカイシールド</h1>
  <p>ミサイルコマンド風の防衛ゲーム、現代版です。敵は弾道ミサイルに加えて<span class="big">ドローン</span>で攻めてきます（ドローンは爆弾を落とします）。<br>
  こちらには<span class="big">AI自動迎撃機</span>が援護についていて、一番危ない敵を自動で撃ち落としてくれます。ただし迎撃には間隔があるので、本命は自分の迎撃です。狙う場所をタップ／クリックして発射してください。</p>
  <div class="hud"><span id="score">スコア: 0</span><span id="wave">ウェーブ: 1</span><span id="cities">都市: 🏙️×6</span></div>
  <div id="status">スタートを押してね</div>
  <canvas id="cv" width="480" height="560"></canvas>
  <div class="btns"><button id="start">▶ スタート／もう一度</button></div>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'), waveEl=document.getElementById('wave'),
      citiesEl=document.getElementById('cities'), statusEl=document.getElementById('status');
const W=480,H=560, GROUND=516, SPD=0.6; // 速度は人間に合わせて0.6倍基準
const BASE_X=[60,240,420];
const CITY_X=[105,155,200,285,330,380];
let bases, cities, pmis, emis, drones, bombs, exps, parts;
let score, wave, running, spawnLeft, spawnT, droneLeft, frame, ally, gameover;
function reset(){
  bases=BASE_X.map(x=>({x, alive:true, ammo:10}));
  cities=CITY_X.map(x=>({x, alive:true}));
  pmis=[]; emis=[]; drones=[]; bombs=[]; exps=[]; parts=[];
  score=0; wave=0; running=true; gameover=false; frame=0;
  ally={x:240, cd:60};
  nextWave();
  scoreEl.textContent='スコア: 0';
  statusEl.textContent='ウェーブ1 開始！ 空をタップして迎撃';
}
function nextWave(){
  wave++;
  bases.forEach(b=>{ if(b.alive) b.ammo=10; });
  spawnLeft=5+wave*2; droneLeft=Math.min(6, Math.floor((wave-1)/1.5)); // ドローンはウェーブ3から
  spawnT=80;
  waveEl.textContent='ウェーブ: '+wave;
  updateCities();
}
function updateCities(){
  citiesEl.textContent='都市: 🏙️×'+cities.filter(c=>c.alive).length;
}
function addScore(n){ score+=n; scoreEl.textContent='スコア: '+score; }
function burst(x,y,color,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*3.4,vy:(Math.random()-0.5)*3.4,life:20,color}); }
function explode(x,y,maxR){ exps.push({x,y,r:2,maxR,phase:0,t:0}); }
function spawnMissile(){
  const sx=Math.random()*W, tx=20+Math.random()*(W-40);
  const dist=Math.hypot(tx-sx, GROUND);
  const speed=(0.95+wave*0.05)*SPD;
  emis.push({x:sx,y:-8,sx,sy:-8,tx,ty:GROUND,t:0,dur:dist/speed,mirv:wave>=4&&Math.random()<0.12,split:false});
}
function spawnDrone(){
  const fromLeft=Math.random()<0.5;
  drones.push({x:fromLeft?-30:W+30, y:56+Math.random()*110, vx:(fromLeft?1:-1)*(1.5*SPD+Math.random()*0.3), ph:Math.random()*6.28, bombT:150+Math.random()*160, hp:1});
}
function fireAt(tx,ty){
  if(!running||gameover) return;
  ty=Math.min(ty, GROUND-8);
  let best=null,bd=1e18;
  bases.forEach(b=>{ if(b.alive&&b.ammo>0){ const d=Math.abs(b.x-tx); if(d<bd){bd=d;best=b;} } });
  if(!best){ statusEl.textContent='迎撃ミサイル切れ／基地がありません'; return; }
  best.ammo--;
  const dist=Math.hypot(tx-best.x, ty-(GROUND-16));
  pmis.push({x:best.x,y:GROUND-16,tx,ty,t:0,dur:dist/6,ally:false});
}
function allyFire(){
  // 一番差し迫った脅威（着弾が近いミサイル、なければドローン／爆弾）を狙う
  let target=null, best=-1;
  emis.forEach(m=>{ if(m.t>best){ best=m.t; target={x:m.x,y:m.y,kind:'m',ref:m}; } });
  if(!target && bombs.length) target={x:bombs[0].x,y:bombs[0].y,kind:'b',ref:bombs[0]};
  if(!target && drones.length) target={x:drones[0].x,y:drones[0].y,kind:'d',ref:drones[0]};
  if(!target) return;
  const dist=Math.hypot(target.x-ally.x, target.y-44);
  pmis.push({x:ally.x,y:44,tx:target.x,ty:target.y,t:0,dur:Math.max(6,dist/8),ally:true});
  ally.cd=120;
}
function damageAt(x){
  cities.forEach(c=>{ if(c.alive && Math.abs(c.x-x)<24){ c.alive=false; burst(c.x,GROUND-8,'#ffb35d',16); } });
  bases.forEach(b=>{ if(b.alive && Math.abs(b.x-x)<26){ b.alive=false; b.ammo=0; burst(b.x,GROUND-8,'#ff5d5d',16); } });
  updateCities();
  if(cities.every(c=>!c.alive)){ gameover=true; running=false; statusEl.textContent='💥 都市が全滅… ゲームオーバー スコア '+score; }
}
function step(){
  requestAnimationFrame(step);
  if(running && !gameover){
    frame++;
    // スポーン
    if(spawnLeft>0){ spawnT--; if(spawnT<=0){ spawnMissile(); spawnLeft--; spawnT=Math.max(34, 125-wave*7); } }
    if(droneLeft>0 && frame%700===350){ spawnDrone(); droneLeft--; }
    // AI援護機
    ally.x=240+Math.sin(frame*0.008)*150;
    if(ally.cd>0) ally.cd--;
    if(ally.cd<=0 && (emis.length||drones.length||bombs.length)) allyFire();
    // 自分の迎撃ミサイル
    pmis.forEach(m=>{ m.t+=1/m.dur; });
    pmis.filter(m=>m.t>=1).forEach(m=>explode(m.tx,m.ty, m.ally?17:27));
    pmis=pmis.filter(m=>m.t<1);
    // 爆発の拡大・持続・縮小
    exps.forEach(e=>{
      e.t++;
      if(e.phase===0){ e.r+=2.1; if(e.r>=e.maxR){ e.phase=1; } }
      else if(e.phase===1){ if(e.t>46) e.phase=2; }
      else { e.r-=1.7; }
    });
    exps=exps.filter(e=>e.r>1);
    const inExp=(x,y)=>exps.some(e=>Math.hypot(e.x-x,e.y-y)<e.r+3);
    // 敵ミサイル
    emis.forEach(m=>{
      m.t+=1/m.dur; m.x=m.sx+(m.tx-m.sx)*m.t; m.y=m.sy+(m.ty-m.sy)*m.t;
      if(m.mirv && !m.split && m.t>0.45){
        m.split=true;
        const tx2=Math.max(16,Math.min(W-16, m.tx+(Math.random()*90-45)));
        const dist=Math.hypot(tx2-m.x, GROUND-m.y);
        emis.push({x:m.x,y:m.y,sx:m.x,sy:m.y,tx:tx2,ty:GROUND,t:0,dur:dist/((0.95+wave*0.05)*SPD),mirv:false,split:true});
      }
      if(inExp(m.x,m.y)){ m.dead=true; addScore(25); burst(m.x,m.y,'#ffd94d',8); }
      else if(m.t>=1){ m.dead=true; explode(m.tx,GROUND-4,20); damageAt(m.tx); }
    });
    emis=emis.filter(m=>!m.dead);
    // ドローン
    drones.forEach(d=>{
      d.x+=d.vx; d.ph+=0.05; d.y+=Math.sin(d.ph)*0.35;
      d.bombT--;
      if(d.bombT<=0 && d.x>20 && d.x<W-20){
        d.bombT=210+Math.random()*140;
        const below=cities.filter(c=>c.alive).sort((a,b)=>Math.abs(a.x-d.x)-Math.abs(b.x-d.x))[0];
        const tx=below?below.x:d.x;
        const dist=Math.hypot(tx-d.x, GROUND-d.y);
        bombs.push({x:d.x,y:d.y+8,sx:d.x,sy:d.y+8,tx,ty:GROUND,t:0,dur:dist/(0.95*SPD)});
      }
      if(inExp(d.x,d.y)){ d.dead=true; addScore(150); burst(d.x,d.y,'#ff9ff3',14); }
      if(d.x<-46||d.x>W+46) d.dead=true;
    });
    drones=drones.filter(d=>!d.dead);
    // 爆弾
    bombs.forEach(b=>{
      b.t+=1/b.dur; b.x=b.sx+(b.tx-b.sx)*b.t; b.y=b.sy+(b.ty-b.sy)*b.t;
      if(inExp(b.x,b.y)){ b.dead=true; addScore(50); burst(b.x,b.y,'#5dff8f',8); }
      else if(b.t>=1){ b.dead=true; explode(b.tx,GROUND-4,18); damageAt(b.tx); }
    });
    bombs=bombs.filter(b=>!b.dead);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; });
    parts=parts.filter(p=>p.life>0);
    // ウェーブ終了
    if(spawnLeft<=0 && droneLeft<=0 && !emis.length && !drones.length && !bombs.length){
      const bonus=cities.filter(c=>c.alive).length*100 + bases.reduce((s,b)=>s+(b.alive?b.ammo:0),0)*5;
      addScore(bonus);
      statusEl.textContent='🎉 ウェーブ'+wave+' クリア！ ボーナス+'+bonus;
      nextWave();
    }
  }
  draw();
}
function drawBase(b){
  ctx.fillStyle=b.alive?'#7a8aa0':'#3a3f4a';
  ctx.beginPath(); ctx.moveTo(b.x-22,GROUND+24); ctx.lineTo(b.x-10,GROUND-14); ctx.lineTo(b.x+10,GROUND-14); ctx.lineTo(b.x+22,GROUND+24); ctx.closePath(); ctx.fill();
  if(b.alive){ ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText(String(b.ammo), b.x, GROUND+12); ctx.textAlign='left'; }
}
function drawCity(c){
  if(!c.alive){ ctx.fillStyle='#2c3038'; ctx.fillRect(c.x-15,GROUND+16,30,6); return; }
  ctx.fillStyle='#ffd94d';
  ctx.fillRect(c.x-14,GROUND-2,9,24); ctx.fillRect(c.x-3,GROUND-9,10,31); ctx.fillRect(c.x+8,GROUND+2,8,20);
  ctx.fillStyle='#7ac5ff';
  ctx.fillRect(c.x-12,GROUND+3,4,4); ctx.fillRect(c.x+0,GROUND-4,4,4); ctx.fillRect(c.x+10,GROUND+7,3,4);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let i=0;i<46;i++){ ctx.fillRect((i*97)%W,(i*61)%300,2,2); }
  // 地面
  ctx.fillStyle='#233018'; ctx.fillRect(0,GROUND+24,W,H-GROUND-24);
  ctx.fillStyle='#31451f'; ctx.fillRect(0,GROUND+22,W,4);
  if(bases) bases.forEach(drawBase);
  if(cities) cities.forEach(drawCity);
  // AI援護機
  if(ally){
    ctx.fillStyle='#5dffca';
    ctx.beginPath(); ctx.arc(ally.x, 40, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(ally.x-15, 37, 30, 5);
    ctx.fillStyle='#0a0f1a'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('AI', ally.x, 43); ctx.textAlign='left';
    ctx.fillStyle='rgba(93,255,202,.85)'; ctx.font='11px sans-serif';
    ctx.fillText(ally.cd>0? 'AI迎撃 再装填中' : 'AI迎撃 準備OK', 8, 20);
  }
  // 敵ミサイル（軌跡つき）
  if(emis) emis.forEach(m=>{
    ctx.strokeStyle='rgba(255,93,93,.55)'; ctx.beginPath(); ctx.moveTo(m.sx,m.sy); ctx.lineTo(m.x,m.y); ctx.stroke();
    ctx.fillStyle='#ff5d5d'; ctx.beginPath(); ctx.arc(m.x,m.y,3.4,0,Math.PI*2); ctx.fill();
  });
  // 爆弾
  if(bombs) bombs.forEach(b=>{
    ctx.strokeStyle='rgba(255,179,93,.5)'; ctx.beginPath(); ctx.moveTo(b.sx,b.sy); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.fillStyle='#ffb35d'; ctx.beginPath(); ctx.arc(b.x,b.y,3.6,0,Math.PI*2); ctx.fill();
  });
  // ドローン
  if(drones) drones.forEach(d=>{
    ctx.fillStyle='#ff9ff3';
    ctx.fillRect(d.x-11,d.y-3,22,6);
    ctx.fillRect(d.x-16,d.y-7,7,3); ctx.fillRect(d.x+9,d.y-7,7,3);
    ctx.fillRect(d.x-16,d.y+4,7,3); ctx.fillRect(d.x+9,d.y+4,7,3);
    ctx.fillStyle='#fff'; ctx.fillRect(d.x-2,d.y-2,4,4);
  });
  // 自分＆AIの迎撃ミサイル
  if(pmis) pmis.forEach(m=>{
    const x=m.x+(m.tx-m.x)*m.t, y=m.y+(m.ty-m.y)*m.t;
    ctx.strokeStyle=m.ally?'rgba(93,255,202,.7)':'rgba(93,200,255,.65)';
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle=m.ally?'#5dffca':'#5dc8ff'; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.moveTo(m.tx-6,m.ty); ctx.lineTo(m.tx+6,m.ty); ctx.moveTo(m.tx,m.ty-6); ctx.lineTo(m.tx,m.ty+6); ctx.stroke();
  });
  // 爆発
  if(exps) exps.forEach(e=>{
    const g=ctx.createRadialGradient(e.x,e.y,1,e.x,e.y,e.r);
    g.addColorStop(0,'rgba(255,240,180,.95)'); g.addColorStop(0.55,'rgba(255,160,60,.75)'); g.addColorStop(1,'rgba(255,80,40,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
  });
  if(parts) parts.forEach(p=>{ ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,3.4,3.4); });
  if(!running && !bases){
    ctx.fillStyle='#fff'; ctx.font='bold 21px sans-serif'; ctx.textAlign='center';
    ctx.fillText('スタートを押してね', W/2, H/2); ctx.textAlign='left';
  }
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  fireAt(x,y);
});
document.getElementById('start').onclick=()=>{ reset(); };
step();
</script>
</body>
</html>
